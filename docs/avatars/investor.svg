<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="The Investor: an impatient investor in a suit holding a stopwatch">
  <!-- Built from the shared judge rig. The page moves the parts named av-body, av-head and av-eyes,
       and swaps av-mouth-closed for av-mouth-open while the judge talks. -->
  <style>.av-mouth-open{display:none}</style>
  <g class="av-body"><rect x="88" y="110" width="24" height="32" rx="9" fill="#cda483"/><path d="M28 200 C30 158 62 140 100 138 C138 140 170 158 172 200 Z" fill="#111827"/><path d="M86 139 L100 170 L114 139 Z" fill="#f8fafc"/><path d="M96 145 H104 L105 168 L100 176 L95 168 Z" fill="#d4a017"/><path d="M86 139 L100 170 L78 160 Z M114 139 L100 170 L122 160 Z" fill="#374151"/><rect x="128" y="160" width="14" height="4" rx="1" fill="#f8fafc"/></g>
  <g class="av-head"><ellipse cx="68" cy="88" rx="5.5" ry="8" fill="#cda483"/><ellipse cx="132" cy="88" rx="5.5" ry="8" fill="#cda483"/><ellipse cx="100" cy="84" rx="32" ry="36" fill="#f2c29b"/><path d="M99 89 Q96 96 101 97" stroke="#a9876c" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M67 78 C63 48 84 40 103 41 C123 42 137 53 133 78 C128 62 116 53 100 53 C86 53 74 61 67 78 Z" fill="#c8a24a"/><path d="M84 50 C96 46 112 46 122 52 M80 56 C94 51 112 51 126 58" stroke="#967937" stroke-width="1.6" fill="none"/><g class="av-eyes"><circle cx="89" cy="84" r="4.4" fill="#1f2430"/><circle cx="90.5" cy="82.5" r="1.4" fill="#fff"/><circle cx="111" cy="84" r="4.4" fill="#1f2430"/><circle cx="112.5" cy="82.5" r="1.4" fill="#fff"/></g><path class="av-brows" d="M80 70 L96 74 M104 74 L120 70" stroke="#c8a24a" stroke-width="3.4" fill="none" stroke-linecap="round"/><g class="av-mouth-closed"><path d="M91 106 Q102 108 110 101" stroke="#6b2a1a" stroke-width="3" fill="none" stroke-linecap="round"/></g><g class="av-mouth-open"><ellipse cx="100" cy="106" rx="8" ry="7.5" fill="#6b1d1d"/><ellipse cx="100" cy="110" rx="5" ry="3" fill="#f87171"/><path d="M93 101.5 H107" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g></g>
