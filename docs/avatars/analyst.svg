<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="t">
  <title id="t">The Analyst: an illustrated analyst with round glasses holding a tablet with a bar chart</title>
  <circle cx="80" cy="80" r="80" fill="#bae6fd"/>
  <!-- faint grid -->
  <path d="M0 40 H160 M0 70 H160 M0 100 H160 M40 0 V160 M120 0 V160" stroke="#7dd3fc" stroke-width="1" opacity=".6"/>
  <clipPath id="c"><circle cx="80" cy="80" r="80"/></clipPath>
  <g clip-path="url(#c)">
    <!-- body: grey cardigan over teal shirt -->
    <path d="M24 160 C26 124 48 110 80 108 C112 110 134 124 136 160 Z" fill="#64748b"/>
    <path d="M68 109 L80 126 L92 109 Z" fill="#0f766e"/>
    <circle cx="80" cy="134" r="2" fill="#334155"/><circle cx="80" cy="146" r="2" fill="#334155"/>
    <!-- neck and head -->
    <rect x="71" y="92" width="18" height="20" rx="6" fill="#8d5a3b"/>
    <ellipse cx="80" cy="70" rx="26" ry="30" fill="#a26a45"/>
    <ellipse cx="54" cy="72" rx="5" ry="7" fill="#8d5a3b"/>
    <ellipse cx="106" cy="72" rx="5" ry="7" fill="#8d5a3b"/>
    <!-- neat short hair with a side part -->
    <path d="M53 66 C50 38 68 32 82 32 C98 32 110 42 107 66 C104 54 100 48 94 46 C84 50 68 50 58 50 C55 54 54 60 53 66 Z" fill="#111827"/>
    <path d="M68 40 L74 48" stroke="#374151" stroke-width="2"/>
    <!-- round glasses -->
    <circle cx="69" cy="68" r="9" fill="#e0f2fe" fill-opacity=".35" stroke="#1f2937" stroke-width="2.5"/>
    <circle cx="92" cy="68" r="9" fill="#e0f2fe" fill-opacity=".35" stroke="#1f2937" stroke-width="2.5"/>
    <path d="M78 68 H83" stroke="#1f2937" stroke-width="2.5"/>
    <circle cx="69" cy="68" r="2.6" fill="#1f2937"/>
    <circle cx="92" cy="68" r="2.6" fill="#1f2937"/>
    <!-- one raised, sceptical eyebrow; flat mouth -->
    <path d="M61 55 H76" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <path d="M85 54 Q92 50 99 53" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M73 87 H88" stroke="#5b2f1a" stroke-width="3" stroke-linecap="round"/>
    <!-- tablet with bar chart -->
    <g transform="rotate(-8 112 128)">
      <rect x="92" y="108" width="44" height="34" rx="4" fill="#1e293b"/>
      <rect x="96" y="112" width="36" height="26" rx="2" fill="#f8fafc"/>
      <rect x="100" y="126" width="5" height="9" fill="#0ea5e9"/>
      <rect x="108" y="120" width="5" height="15" fill="#0ea5e9"/>
      <rect x="116" y="123" width="5" height="12" fill="#0ea5e9"/>
      <rect x="124" y="115" width="5" height="20" fill="#0284c7"/>
    </g>
    <ellipse cx="96" cy="140" rx="9" ry="7" fill="#a26a45"/>
  </g>
</svg>
