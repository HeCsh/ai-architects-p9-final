<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="A judge">
  <!-- Built from the shared judge rig. The page moves the parts named av-body, av-head and av-eyes,
       and swaps av-mouth-closed for av-mouth-open while the judge talks. -->
  <style>.av-mouth-open{display:none}</style>
  <g class="av-body"><rect x="88" y="110" width="24" height="32" rx="9" fill="#c09877"/><path d="M28 200 C30 158 62 140 100 138 C138 140 170 158 172 200 Z" fill="currentColor"/><path d="M86 139 Q100 150 114 139" stroke="#1f2430" stroke-opacity=".25" stroke-width="3" fill="none"/></g>
  <g class="av-head"><ellipse cx="68" cy="88" rx="5.5" ry="8" fill="#c09877"/><ellipse cx="132" cy="88" rx="5.5" ry="8" fill="#c09877"/><ellipse cx="100" cy="84" rx="32" ry="36" fill="#e3b38c"/><path d="M99 89 Q96 96 101 97" stroke="#9e7d62" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M67 76 C66 50 84 44 100 44 C118 44 134 50 133 76 C126 62 112 58 100 58 C88 58 74 62 67 76 Z" fill="#3f2a1d"/><g class="av-eyes"><circle cx="89" cy="84" r="4.4" fill="#1f2430"/><circle cx="90.5" cy="82.5" r="1.4" fill="#fff"/><circle cx="111" cy="84" r="4.4" fill="#1f2430"/><circle cx="112.5" cy="82.5" r="1.4" fill="#fff"/></g><path class="av-brows" d="M81 73 Q88 69 95 72 M105 72 Q112 69 119 73" stroke="#3f2a1d" stroke-width="3.4" fill="none" stroke-linecap="round"/><g class="av-mouth-closed"><path d="M90 103 Q100 112 110 103" stroke="#7a2e1d" stroke-width="3" fill="none" stroke-linecap="round"/></g><g class="av-mouth-open"><ellipse cx="100" cy="106" rx="8" ry="7.5" fill="#6b1d1d"/><ellipse cx="100" cy="110" rx="5" ry="3" fill="#f87171"/><path d="M93 101.5 H107" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g></g>
  <g class="av-prop"></g>
</svg>
