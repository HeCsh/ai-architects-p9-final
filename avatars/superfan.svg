  <g class="av-head"><circle cx="68" cy="60" r="20" fill="#111111"/><circle cx="132" cy="60" r="20" fill="#111111"/><circle cx="100" cy="46" r="26" fill="#111111"/><circle cx="80" cy="44" r="16" fill="#111111"/><circle cx="120" cy="44" r="16" fill="#111111"/><ellipse cx="68" cy="88" rx="5.5" ry="8" fill="#673e27"/><ellipse cx="132" cy="88" rx="5.5" ry="8" fill="#673e27"/><ellipse cx="100" cy="84" rx="32" ry="36" fill="#7a4a2e"/><circle cx="80" cy="97" r="5" fill="#f87171" opacity=".28"/><circle cx="120" cy="97" r="5" fill="#f87171" opacity=".28"/><path d="M99 89 Q96 96 101 97" stroke="#553320" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M70 74 C74 56 90 50 100 54 C112 50 128 56 130 74 C120 64 110 62 100 66 C90 62 80 64 70 74 Z" fill="#111111"/><g class="av-eyes"><circle cx="89" cy="84" r="4.4" fill="#1f2430"/><circle cx="90.5" cy="82.5" r="1.4" fill="#fff"/><circle cx="111" cy="84" r="4.4" fill="#1f2430"/><circle cx="112.5" cy="82.5" r="1.4" fill="#fff"/></g><path class="av-brows" d="M80 70 Q88 63 96 69 M104 69 Q112 63 120 70" stroke="#111111" stroke-width="3.4" fill="none" stroke-linecap="round"/><g class="av-mouth-closed"><path d="M88 101 Q100 117 112 101 Z" fill="#7f1d1d"/><path d="M91 102 H109 L108 105 H92 Z" fill="#fff"/></g><g class="av-mouth-open"><ellipse cx="100" cy="106" rx="8" ry="7.5" fill="#6b1d1d"/><ellipse cx="100" cy="110" rx="5" ry="3" fill="#f87171"/><path d="M93 101.5 H107" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g><path d="M68 62 C80 52 120 52 132 62" stroke="#fde047" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M100 40 l4 9 10 1 -8 6 3 10 -9 -6 -9 6 3 -10 -8 -6 10 -1 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.2"/></g>
