<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="The Pundit: a loud TV pundit with a microphone">
  <!-- Built from the shared judge rig. The page moves the parts named av-body, av-head and av-eyes,
       and swaps av-mouth-closed for av-mouth-open while the judge talks. -->
  <style>.av-mouth-open{display:none}</style>
  <g class="av-body"><rect x="88" y="110" width="24" height="32" rx="9" fill="#cc9d75"/><path d="M28 200 C30 158 62 140 100 138 C138 140 170 158 172 200 Z" fill="#1e3a8a"/><path d="M84 139 L100 172 L116 139 Z" fill="#fff"/><path d="M96 146 H104 L106 168 L100 178 L94 168 Z" fill="#dc2626"/><path d="M84 139 L100 172 L76 158 Z M116 139 L100 172 L124 158 Z" fill="#274bb3"/></g>
  <g class="av-head"><ellipse cx="68" cy="88" rx="5.5" ry="8" fill="#cc9d75"/><ellipse cx="132" cy="88" rx="5.5" ry="8" fill="#cc9d75"/><ellipse cx="100" cy="84" rx="32" ry="36" fill="#f0b98a"/><path d="M99 89 Q96 96 101 97" stroke="#a88160" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M66 82 C60 46 86 36 106 40 C126 44 138 60 133 82 C128 64 114 56 98 60 C84 62 72 70 66 82 Z" fill="#3f2a1d"/><path d="M96 42 C110 26 136 34 131 56 C122 46 110 42 96 42 Z" fill="#3f2a1d"/><g class="av-eyes"><circle cx="89" cy="84" r="4.4" fill="#1f2430"/><circle cx="90.5" cy="82.5" r="1.4" fill="#fff"/><circle cx="111" cy="84" r="4.4" fill="#1f2430"/><circle cx="112.5" cy="82.5" r="1.4" fill="#fff"/></g><path class="av-brows" d="M80 70 Q88 63 96 69 M104 69 Q112 63 120 70" stroke="#3f2a1d" stroke-width="3.4" fill="none" stroke-linecap="round"/><g class="av-mouth-closed"><path d="M88 101 Q100 117 112 101 Z" fill="#7f1d1d"/><path d="M91 102 H109 L108 105 H92 Z" fill="#fff"/></g><g class="av-mouth-open"><ellipse cx="100" cy="106" rx="8" ry="7.5" fill="#6b1d1d"/><ellipse cx="100" cy="110" rx="5" ry="3" fill="#f87171"/><path d="M93 101.5 H107" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g></g>
  <g class="av-prop"><g transform="rotate(-16 150 160)"><rect x="145" y="136" width="10" height="36" rx="4" fill="#111827"/><circle cx="150" cy="132" r="11" fill="#6b7280" stroke="#374151" stroke-width="2"/><path d="M142 129 h16 M141 134 h18" stroke="#4b5563" stroke-width="1.5"/><rect x="144" y="148" width="12" height="7" fill="#dc2626"/></g><ellipse cx="152" cy="176" rx="12" ry="10" fill="#f0b98a"/></g>
</svg>
