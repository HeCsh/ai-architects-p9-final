<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="t">
  <title id="t">The Supporter: an illustrated fan in a bobble hat and striped scarf, cheering</title>
  <circle cx="80" cy="80" r="80" fill="#bbf7d0"/>
  <!-- confetti -->
  <g opacity=".8">
    <rect x="22" y="40" width="6" height="3" fill="#16a34a" transform="rotate(30 25 41)"/>
    <rect x="132" y="48" width="6" height="3" fill="#facc15" transform="rotate(-25 135 49)"/>
    <rect x="30" y="96" width="6" height="3" fill="#facc15" transform="rotate(60 33 97)"/>
    <rect x="128" y="92" width="6" height="3" fill="#16a34a" transform="rotate(15 131 93)"/>
  </g>
  <clipPath id="c"><circle cx="80" cy="80" r="80"/></clipPath>
  <g clip-path="url(#c)">
    <!-- body: green jersey -->
    <path d="M22 160 C24 124 46 110 80 108 C114 110 136 124 138 160 Z" fill="#15803d"/>
    <!-- neck and head -->
    <rect x="70" y="92" width="20" height="18" rx="6" fill="#d9a066"/>
    <ellipse cx="80" cy="72" rx="27" ry="30" fill="#e8b27a"/>
    <!-- striped scarf -->
    <path d="M50 102 C64 112 96 112 110 102 L112 114 C96 124 64 124 48 114 Z" fill="#facc15"/>
    <path d="M58 106 l6 2 -2 12 -6 -2 Z M74 109 h6 v12 h-6 Z M90 109 l6 -1 1 12 -6 1 Z" fill="#166534"/>
    <path d="M96 114 L106 152 L118 150 L108 110 Z" fill="#facc15"/>
    <path d="M99 124 l10 -2 2 7 -10 2 Z M102 138 l10 -2 2 7 -10 2 Z" fill="#166534"/>
    <!-- bobble hat -->
    <path d="M52 62 C52 34 108 34 108 62 Z" fill="#166534"/>
    <rect x="50" y="56" width="60" height="10" rx="4" fill="#facc15"/>
    <path d="M62 46 h36 M58 52 h44" stroke="#facc15" stroke-width="3"/>
    <circle cx="80" cy="32" r="8" fill="#facc15"/>
    <!-- face paint stripes on cheeks -->
    <path d="M58 76 h9 M58 80 h9" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M93 76 h9 M93 80 h9" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
    <!-- happy closed eyes, cheering mouth -->
    <path d="M64 70 Q69 65 74 70" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M86 70 Q91 65 96 70" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M68 84 Q80 102 92 84 Z" fill="#7f1d1d"/>
    <ellipse cx="80" cy="93" rx="6" ry="3" fill="#f87171"/>
  </g>
</svg>
