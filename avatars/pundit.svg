<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="t">
  <title id="t">The Pundit: an illustrated TV pundit in a blazer, talking into a microphone</title>
  <circle cx="80" cy="80" r="80" fill="#fed7aa"/>
  <!-- studio light rays -->
  <path d="M80 80 L20 10 L45 5 Z M80 80 L140 10 L115 5 Z" fill="#fdba74" opacity=".6"/>
  <clipPath id="c"><circle cx="80" cy="80" r="80"/></clipPath>
  <g clip-path="url(#c)">
    <!-- body: navy blazer, white shirt, red tie -->
    <path d="M22 160 C24 124 46 110 80 108 C114 110 136 124 138 160 Z" fill="#1e3a8a"/>
    <path d="M64 109 L80 140 L96 109 Z" fill="#fff"/>
    <path d="M76 114 L84 114 L86 136 L80 144 L74 136 Z" fill="#dc2626"/>
    <path d="M64 109 L80 140 L58 126 Z M96 109 L80 140 L102 126 Z" fill="#1e40af"/>
    <!-- neck and head -->
    <rect x="70" y="92" width="20" height="20" rx="6" fill="#e0a77a"/>
    <ellipse cx="80" cy="70" rx="27" ry="31" fill="#f0b98a"/>
    <ellipse cx="53" cy="72" rx="5" ry="7" fill="#e0a77a"/>
    <ellipse cx="107" cy="72" rx="5" ry="7" fill="#e0a77a"/>
    <!-- big swept hair -->
    <path d="M52 62 C48 34 72 26 90 30 C106 33 114 46 108 60 C100 48 84 44 70 50 C62 53 56 58 52 62 Z" fill="#3f2a1d"/>
    <path d="M86 30 C100 22 116 30 112 44 C106 36 96 34 86 30 Z" fill="#3f2a1d"/>
    <!-- raised eyebrows, eyes -->
    <path d="M62 58 Q69 52 76 57" stroke="#3f2a1d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M85 57 Q92 52 99 58" stroke="#3f2a1d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="69" cy="66" r="3.2" fill="#1f2937"/>
    <circle cx="92" cy="66" r="3.2" fill="#1f2937"/>
    <!-- loud open mouth -->
    <path d="M70 82 Q80 98 92 82 Z" fill="#7f1d1d"/>
    <path d="M73 83 L89 83 L88 86 L74 86 Z" fill="#fff"/>
    <!-- microphone in hand -->
    <ellipse cx="120" cy="124" rx="13" ry="11" fill="#f0b98a"/>
    <rect x="114" y="92" width="10" height="30" rx="4" fill="#111827" transform="rotate(-18 119 107)"/>
    <circle cx="112" cy="88" r="10" fill="#6b7280"/>
    <circle cx="112" cy="88" r="10" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M105 84 h14 M104 89 h16 M106 94 h12" stroke="#4b5563" stroke-width="1.5"/>
  </g>
</svg>
